name: Publish Murzex packages

on:
  push:
    branches:
      - main # Скрипт сработает при каждом пуше в main

    paths:
      - 'packages/murzex-vue/**' # Сработает только если менялся код библиотеки

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9 # или твоя версия pnpm

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build Library
        # Запускаем билд именно в папке библиотеки
        run: pnpm run build:mvue

      - name: Get Version
        id: vars
        # Достаем версию из package.json библиотеки для релиза
        run: echo "VERSION=$(node -p "require('./packages/murzex-vue/package.json').version")" >> $GITHUB_ENV

      - name: Publish to NPM
        # Публикуем из папки пакета
        run: pnpm --filter ./packages/murzex-vue publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          generate_release_notes: true # GitHub сам напишет, что изменилось
          files: |
            dist/**
