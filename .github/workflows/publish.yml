name: Publish Murzex packages

on:
  push:
    branches:
      - main

    paths:
      - 'packages/murzex-vue/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build Library
        run: pnpm run build:mvue

      - name: Get Version
        id: vars
        run: echo "VERSION=$(node -p "require('./packages/murzex-vue/package.json').version")" >> $GITHUB_ENV

      - name: Publish to NPM
        run: pnpm --filter ./packages/murzex-vue publish --access public
